# Render Blueprint for the backend (Docker web service).
# Render dashboard → New → Blueprint → pick this repo. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: llm-chatbot-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      # On a paid plan, attach a persistent disk so SQLite survives redeploys:
      # disk:
      #   name: chat-data
      #   mountPath: /data
      #   sizeGB: 1
